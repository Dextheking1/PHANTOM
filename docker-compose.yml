services:
  phantom:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./workspace:/app/workspace
    environment:
      - NODE_ENV=production
      - HOST=0.0.0.0
      - PHANTOM_LOCAL_MODE=true
      - PORT=3000
      - API_TOKEN=${API_TOKEN}
